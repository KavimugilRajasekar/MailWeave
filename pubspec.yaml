name: mailweave
description: "MailWeave is an Android-only email client that fetches mail and displays conversations as threaded tree branches, showing replies in a structured branching layout."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.12.1
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Custom fonts for the MailWeave UI.
  fonts:
    # Comfortaa - rounded geometric font used for display/headings.
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa/static/Comfortaa-Light.ttf
          weight: 300
        - asset: assets/fonts/Comfortaa/static/Comfortaa-Regular.ttf
          weight: 400
        - asset: assets/fonts/Comfortaa/static/Comfortaa-Medium.ttf
          weight: 500
        - asset: assets/fonts/Comfortaa/static/Comfortaa-Bold.ttf
          weight: 700
    # Playwrite US Modern - handwriting-style accent font.
    - family: Playwrite US Modern
      fonts:
        - asset: assets/fonts/Playwrite_US_Modern/static/PlaywriteUSModern-Thin.ttf
          weight: 100
        - asset: assets/fonts/Playwrite_US_Modern/static/PlaywriteUSModern-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Playwrite_US_Modern/static/PlaywriteUSModern-Light.ttf
          weight: 300
        - asset: assets/fonts/Playwrite_US_Modern/static/PlaywriteUSModern-Regular.ttf
          weight: 400

# flutter_launcher_icons configuration
# Generates all Android mipmap icon sizes from assets/mailweave.png.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/mailweave.png"
  min_sdk_android: 21
