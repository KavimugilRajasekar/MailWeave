name: Deploy MailWeave Static Site

on:
  push:
    branches:
      - master
    paths:
      - 'mailweave-webpage/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mailweave-webpage
          destination_dir: mailweave
          publish_branch: gh-pages
          user_name: 'GitHub Action'
          user_email: 'action@github.com'
          commit_message: 'Deploy MailWeave static site'
